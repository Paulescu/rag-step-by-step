[project]
name = "customer-support-chatbot"
version = "0.1.0"
description = "Customer support chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pypdf>=6.14.2",
    "qdrant-client>=1.19.0",
]

[project.optional-dependencies]
# Pulls torch. Only needed to actually run BGE-M3; chunking, storage and tests do not.
embeddings = [
    "FlagEmbedding>=1.3.0",
]

[project.scripts]
kb = "customer_support_chatbot.ingestion.cli:main"
kb-demo = "customer_support_chatbot.demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_support_chatbot"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
